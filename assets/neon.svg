<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">J0XCORE — Cyberpunk developer terminal</title>
<desc id="desc">Neon cyan and magenta terminal with an animated scanner, pulsing circuitry and blinking cursor. Full Stack Developer. Rust, React, Linux.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070B18"/><stop offset=".55" stop-color="#101129"/><stop offset="1" stop-color="#230D2C"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#00F0FF"/><stop offset=".55" stop-color="#9067FF"/><stop offset="1" stop-color="#FF2D95"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3A4266" stroke-width=".6" opacity=".4"/></pattern>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1H4" stroke="#000" opacity=".18"/></pattern>
 <filter id="glow" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 .scan{animation:sweep 7s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.cursor{animation:blink 1.2s steps(2,end) infinite}.signal{animation:signal 5s linear infinite}
 @keyframes sweep{from{transform:translateY(-290px)}to{transform:translateY(290px)}}
 @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
 @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
 @keyframes signal{from{stroke-dashoffset:220}to{stroke-dashoffset:0}}
 @media(prefers-reduced-motion:reduce){.scan,.pulse,.cursor,.signal{animation:none}.scan{opacity:0}}
</style>
<rect width="1200" height="380" rx="18" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="378" rx="18" fill="url(#grid)" stroke="#353251"/>
<path d="M24 66V24H150M1050 24H1176V66M24 314V356H150M1050 356H1176V314" fill="none" stroke="url(#neon)" stroke-width="3"/>
<g font-family="monospace" font-size="12" letter-spacing="2" fill="#8493B5"><text x="52" y="49">SYS://J0XCORE</text><text x="940" y="49">SECURE CHANNEL</text></g>
<circle cx="1138" cy="45" r="4" fill="#00F0FF" class="pulse"/>
<g opacity=".35" fill="none" stroke="url(#neon)"><path d="M0 110H160L205 155H290M0 128H130L185 183H255M1200 245H1050L995 190H925M1200 265H1020L965 210H930"/><path class="signal" stroke-width="3" stroke-dasharray="20 200" d="M0 110H160L205 155H290M1200 245H1050L995 190H925"/></g>
<g fill="none" stroke="#FF2D95" opacity=".5"><circle cx="1040" cy="135" r="35"/><circle cx="1040" cy="135" r="48" stroke-dasharray="4 9" class="pulse"/><path d="M980 135H1100M1040 75V195"/></g>
<text x="600" y="115" text-anchor="middle" fill="#00F0FF" font-family="monospace" font-size="13" letter-spacing="5">[ WELCOME TO THE NEON GRID ]</text>
<text x="602" y="214" text-anchor="middle" fill="#FF2D95" opacity=".5" font-family="monospace" font-weight="900" font-size="92" letter-spacing="10">J0XCORE</text>
<text x="598" y="210" text-anchor="middle" fill="#DDFDFF" filter="url(#glow)" font-family="monospace" font-weight="900" font-size="92" letter-spacing="10">J0XCORE</text>
<path d="M350 232H850" stroke="url(#neon)" stroke-width="2"/>
<text x="600" y="268" text-anchor="middle" fill="#B6C5E5" font-family="monospace" font-size="16" letter-spacing="5">FULL STACK DEVELOPER</text>
<g font-family="monospace" font-size="12"><text x="52" y="331" fill="#00F0FF">&gt; RUST / REACT / LINUX</text><text x="887" y="331" fill="#FF76BB">STATUS: BUILDING</text><rect x="1030" y="320" width="9" height="14" fill="#00F0FF" class="cursor"/></g>
<rect x="30" y="190" width="1140" height="2" fill="#00F0FF" opacity=".18" class="scan"/>
<rect x="2" y="2" width="1196" height="376" rx="18" fill="url(#scan)"/>
</svg>
